<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480" font-family="'DejaVu Sans Mono','Cascadia Code','Consolas',monospace" font-size="15">
  <defs>
    <style>
      .t { fill:#d4d4d4; white-space:pre; }
      .cyan { fill:#29b8db; } .cyanb { fill:#29b8db; font-weight:bold; }
      .gray { fill:#808080; } .green { fill:#23d18b; } .greenb { fill:#23d18b; font-weight:bold; }
      .white { fill:#e6e6e6; font-weight:bold; }
      .mag { fill:#d670d6; } .red { fill:#f14c4c; } .yel { fill:#f5f543; }
      .blue { fill:#3b8eea; } .ruler { fill:#3a3a3a; }
    </style>
  </defs>

  <!-- janela -->
  <rect x="0" y="0" width="820" height="480" rx="10" fill="#0c0c0c"/>
  <rect x="0" y="0" width="820" height="34" rx="10" fill="#1e1e1e"/>
  <rect x="0" y="22" width="820" height="12" fill="#1e1e1e"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="410" y="22" text-anchor="middle" class="gray" font-size="13">secscan — terminal</text>

  <!-- conteudo -->
  <g transform="translate(18,0)">
    <text x="0" y="62" class="t"><tspan class="green">$</tspan> <tspan class="white">secscan</tspan> scan https://loja.exemplo.com --perfil completo --autorizo</text>

    <!-- banner -->
    <text x="0" y="96"  class="cyanb" xml:space="preserve">  ___ ___ ___ ___ ___ __ _ _ _</text>
    <text x="0" y="114" class="cyanb" xml:space="preserve"> / __| __/ __/ __/ __/ _` | ' \</text>
    <text x="0" y="132" class="cyanb" xml:space="preserve"> \__ \ _| (__\__ \ (_| (_| | || |</text>
    <text x="0" y="150" class="cyanb" xml:space="preserve"> |___/___\___|___/___\__,_|_||_|</text>
    <text x="0" y="170" class="gray" xml:space="preserve">  auditoria de seguranca web · v0.5.0 · uso autorizado</text>

    <text x="0" y="200" class="t"><tspan class="white">alvo:</tspan> <tspan class="cyan">https://loja.exemplo.com</tspan></text>
    <text x="0" y="214" class="ruler">────────────────────────────────────────────────────────────</text>

    <text x="0" y="238" class="gray">[+] headers (passivo)</text>
    <text x="0" y="256" class="gray">[+] tls (passivo)</text>
    <text x="0" y="274" class="gray">[+] cors (passivo)</text>
    <text x="0" y="292" class="gray">[+] git_exposure (ativo)</text>
    <text x="0" y="310" class="gray">[+] open_redirect (ativo)</text>
    <text x="0" y="328" class="gray">[+] sql_injection (intrusivo)</text>
    <text x="0" y="346" class="gray">[+] xss (intrusivo)</text>
    <text x="0" y="364" class="gray">[+] ssrf (intrusivo)</text>

    <text x="0" y="392" class="ruler">────────────────────────────────────────────────────────────</text>
    <text x="0" y="416" class="t"><tspan class="greenb">[FIM]</tspan> <tspan class="white">14</tspan> achados  <tspan class="mag">crit 0</tspan>  <tspan class="red">alto 2</tspan>  <tspan class="yel">med 5</tspan>  <tspan class="blue">baixo 3</tspan>  <tspan class="gray">info 4</tspan>  em 6.4s</text>
    <text x="0" y="446" class="t"><tspan class="green">$</tspan> <tspan class="gray">▏</tspan></text>
  </g>
</svg>
