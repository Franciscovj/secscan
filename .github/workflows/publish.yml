name: publish

# Publica no PyPI quando um release do GitHub e publicado.
# Usa Trusted Publishing (OIDC): NAO precisa de token/segredo no repositorio.
# Configuracao unica no PyPI (pypi.org -> projeto/conta -> Publishing):
#   Owner: Franciscovj | Repository: secscan
#   Workflow: publish.yml | Environment: pypi

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build do pacote
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # necessario para o Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publica no PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
