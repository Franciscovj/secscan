[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secscan"
version = "0.4.0"
description = "Ferramenta de auditoria de seguranca web da OrbitFVJ (uso autorizado)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Francisco Vito Junior" }]
keywords = ["security", "scanner", "web", "auditoria", "pentest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Natural Language :: Portuguese (Brazilian)",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
secscan = "secscan.cli:main"

[project.urls]
Homepage = "https://github.com/Franciscovj/secscan"
Repository = "https://github.com/Franciscovj/secscan"
Issues = "https://github.com/Franciscovj/secscan/issues"

[tool.setuptools.packages.find]
include = ["secscan*"]

[tool.setuptools.package-data]
secscan = ["wordlists/*.txt"]
