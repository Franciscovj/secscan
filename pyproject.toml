[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secscan"
version = "0.3.0"
description = "Ferramenta de auditoria de seguranca web da OrbitFVJ (uso autorizado)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Francisco Vito Junior" }]
keywords = ["security", "scanner", "web", "auditoria", "pentest"]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
secscan = "secscan.cli:main"

[project.urls]
Homepage = "https://github.com/Franciscovj/secscan"

[tool.setuptools.packages.find]
include = ["secscan*"]

[tool.setuptools.package-data]
secscan = ["wordlists/*.txt"]
